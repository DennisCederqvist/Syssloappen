<div class="page-enter min-h-dvh bg-child-bg pb-28 md:flex md:pb-0">
  <app-child-side-nav />

  <main class="mx-auto w-full max-w-5xl flex-1 px-5 py-6 sm:px-8 md:py-8">
    <app-child-page-header
      [name]="childName()"
      subtitle="Byt dina poäng mot en belöning"
      [points]="availablePoints()"
    />

    <section class="mt-7" aria-labelledby="rewards-title" aria-live="polite">
      <h2 id="rewards-title" class="sr-only">Belöningar</h2>

      @if (loading()) {
        <div
          class="flex min-h-40 items-center justify-center rounded-[30px] bg-white p-6 text-center shadow-[4px_6px_0_rgba(0,0,0,0.04)]"
          role="status"
        >
          <p class="font-semibold text-child-text-secondary">Hämtar belöningar…</p>
        </div>
      } @else if (error()) {
        <div
          class="rounded-[30px] bg-white p-6 text-center shadow-[4px_6px_0_rgba(0,0,0,0.04)]"
          role="alert"
        >
          <p class="font-semibold text-red-700">{{ error() }}</p>
          <button
            type="button"
            (click)="load()"
            class="mt-4 min-h-11 rounded-full bg-[linear-gradient(180deg,var(--color-child-cta-from),var(--color-child-cta-to))] px-5 font-bold text-child-text shadow-[4px_6px_0_var(--color-child-cta-shadow)]"
          >
            Försök igen
          </button>
        </div>
      } @else if (rewards().length === 0) {
        <div
          class="flex min-h-48 flex-col items-center justify-center rounded-[30px] bg-child-card-mint p-6 text-center shadow-[4px_6px_0_var(--color-child-card-mint-shadow)]"
        >
          <h3 class="font-display text-xl font-semibold text-child-text">
            Inga belöningar just nu
          </h3>
          <p class="mt-2 max-w-md text-child-text-secondary">
            Kolla i Önskningar för status på det du redan har önskat.
          </p>
        </div>
      } @else {
        <div class="grid gap-5 sm:grid-cols-2">
          @for (reward of rewards(); track reward.id; let i = $index) {
            <app-child-reward-card
              [cardId]="'child-reward-' + reward.id"
              [name]="reward.name"
              [description]="reward.description"
              [pointsCost]="reward.pointsCost"
              [palette]="paletteFor(i)"
              [tiltDeg]="tiltFor(reward.id)"
              [wobbling]="wobblingRewardId() === reward.id"
              [busy]="busyId() === reward.id"
              [disabled]="busyId() !== null || !canAfford(reward)"
              (requested)="request(reward)"
            />
          }
        </div>
      }
    </section>
  </main>
</div>
