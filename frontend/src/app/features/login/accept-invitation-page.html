<main class="page-enter mx-auto flex min-h-dvh w-full max-w-md items-center px-5 py-8 sm:px-8">
  <section class="w-full rounded-3xl bg-white p-6 shadow-lg ring-1 ring-line sm:p-8">
    <p class="text-sm font-extrabold uppercase tracking-wider text-brand-600">
      {{ 'auth.acceptInvitation.eyebrow' | transloco }}
    </p>
    <h1 class="mt-2 text-3xl font-black">{{ 'auth.acceptInvitation.title' | transloco }}</h1>
    @if (success()) {
      <div class="mt-6 rounded-2xl bg-green-50 p-4 font-bold text-green-900" role="status">
        {{ 'auth.acceptInvitation.successMessage' | transloco }}
      </div>
      <button
        type="button"
        (click)="goToLogin()"
        class="mt-6 min-h-14 w-full rounded-2xl bg-brand-500 px-5 font-extrabold text-white"
      >
        {{ 'auth.acceptInvitation.goToLogin' | transloco }}
      </button>
    } @else {
      <p class="mt-2 leading-7 text-muted">
        {{ 'auth.acceptInvitation.description' | transloco }}
      </p>
      @if (errorMessage()) {
        <p class="mt-4 rounded-2xl bg-red-50 p-4 text-sm font-bold text-red-800" role="alert">
          {{ errorMessage() }}
        </p>
      }
      <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-5" novalidate>
        <label class="block font-bold"
          >{{ 'auth.acceptInvitation.invitationCodeLabel' | transloco
          }}<input
            formControlName="invitationCode"
            maxlength="9"
            [placeholder]="'auth.acceptInvitation.invitationCodePlaceholder' | transloco"
            class="mt-2 min-h-14 w-full rounded-2xl border border-line px-4 text-lg uppercase"
        /></label>
        <label class="block font-bold"
          >{{ 'auth.acceptInvitation.emailLabel' | transloco
          }}<input
            formControlName="email"
            type="email"
            autocomplete="email"
            class="mt-2 min-h-14 w-full rounded-2xl border border-line px-4"
        /></label>
        <label class="block font-bold"
          >{{ 'auth.acceptInvitation.firstNameLabel' | transloco
          }}<input
            formControlName="firstName"
            type="text"
            autocomplete="given-name"
            class="mt-2 min-h-14 w-full rounded-2xl border border-line px-4"
        /></label>
        <label class="block font-bold"
          >{{ 'auth.acceptInvitation.lastNameLabel' | transloco
          }}<input
            formControlName="lastName"
            type="text"
            autocomplete="family-name"
            class="mt-2 min-h-14 w-full rounded-2xl border border-line px-4"
        /></label>
        <label class="block font-bold"
          >{{ 'auth.acceptInvitation.nicknameLabel' | transloco
          }}<input
            formControlName="nickname"
            type="text"
            autocomplete="nickname"
            class="mt-2 min-h-14 w-full rounded-2xl border border-line px-4"
        /></label>
        <label class="block font-bold"
          >{{ 'auth.acceptInvitation.passwordLabel' | transloco
          }}<input
            formControlName="password"
            type="password"
            autocomplete="new-password"
            class="mt-2 min-h-14 w-full rounded-2xl border border-line px-4"
        /></label>
        <button
          type="submit"
          [disabled]="isSubmitting()"
          class="min-h-14 w-full rounded-2xl bg-brand-500 px-5 font-extrabold text-white"
        >
          {{
            (isSubmitting() ? 'auth.acceptInvitation.submitting' : 'auth.acceptInvitation.submit')
              | transloco
          }}
        </button>
      </form>
    }
  </section>
</main>
