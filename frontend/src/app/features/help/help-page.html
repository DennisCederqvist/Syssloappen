<div class="page-enter min-h-dvh bg-adult-bg pb-10">
  <main class="mx-auto w-full max-w-2xl px-4 py-5 sm:px-6 md:px-8 md:py-8">
    <a
      routerLink="/"
      class="mb-4 inline-flex items-center gap-1.5 text-sm font-medium text-adult-text-secondary no-underline transition hover:text-adult-text"
    >
      <svg
        viewBox="0 0 24 24"
        class="size-4"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M15 5l-7 7 7 7" />
      </svg>
      {{ 'help.backLink' | transloco }}
    </a>

    <app-adult-page-header [title]="'help.pageTitle' | transloco" />

    <p class="mt-5 text-sm leading-6 text-adult-text-secondary">
      {{ 'help.intro' | transloco }}
    </p>

    <div class="mt-4 grid gap-2">
      @for (key of faqKeys; track key) {
        <details class="group rounded-lg border border-adult-border bg-adult-surface p-4">
          <summary
            class="flex cursor-pointer list-none items-center justify-between gap-3 text-[15px] font-semibold text-adult-text"
          >
            {{ 'help.faq.' + key + '.question' | transloco }}
            <svg
              viewBox="0 0 24 24"
              class="size-4 shrink-0 text-adult-text-secondary transition group-open:rotate-90"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 5l7 7-7 7" />
            </svg>
          </summary>
          <p class="mt-3 text-sm leading-6 text-adult-text-secondary">
            {{ 'help.faq.' + key + '.answer' | transloco }}
          </p>
        </details>
      }
    </div>

    <p
      class="mt-6 rounded-lg border border-adult-border bg-adult-surface p-4 text-sm leading-6 text-adult-text-secondary"
    >
      {{ 'help.stillStuck' | transloco }}
      <a href="mailto:sysslo.support@gmail.com" class="font-semibold text-adult-accent-dark"
        >sysslo.support&#64;gmail.com</a
      >
    </p>
  </main>
</div>
