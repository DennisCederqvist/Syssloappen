<div class="page-enter min-h-dvh bg-adult-bg pb-24 md:flex md:pb-0">
  <app-adult-bottom-nav />
  <main class="mx-auto w-full max-w-2xl flex-1 px-4 py-5 sm:px-6 md:px-8 md:py-8">
    <app-adult-page-header title="Inställningar" />

    <nav class="mt-6 grid gap-2" aria-label="Tillgängliga familjeinställningar">
      <a
        routerLink="/vuxen/installningar/barn"
        class="flex items-center gap-3 rounded-lg border border-adult-border bg-adult-surface p-3 no-underline transition hover:border-adult-accent/30"
      >
        <span
          class="grid size-10 shrink-0 place-items-center rounded-lg bg-adult-accent-soft text-adult-accent-dark"
          aria-hidden="true"
        >
          <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 19a4 4 0 0 0-8 0" />
            <circle cx="12" cy="10" r="3.2" />
            <path d="M20 19a3.2 3.2 0 0 0-2.2-3" />
            <circle cx="17.2" cy="8.6" r="1.8" />
          </svg>
        </span>
        <span class="min-w-0 flex-1">
          <span class="block text-[15px] font-semibold text-adult-text">Barn och konton</span>
          <span class="mt-0.5 block text-sm text-adult-text-secondary">Profiler och enheter</span>
        </span>
        <svg viewBox="0 0 24 24" class="size-4 shrink-0 text-adult-text-secondary" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 5l7 7-7 7" />
        </svg>
      </a>
      <a
        routerLink="/vuxen/bjud-in"
        class="flex items-center gap-3 rounded-lg border border-adult-border bg-adult-surface p-3 no-underline transition hover:border-adult-accent/30"
      >
        <span
          class="grid size-10 shrink-0 place-items-center rounded-lg bg-adult-accent-soft text-adult-accent-dark"
          aria-hidden="true"
        >
          <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="M3.5 6.5 12 13l8.5-6.5" />
          </svg>
        </span>
        <span class="min-w-0 flex-1">
          <span class="block text-[15px] font-semibold text-adult-text">Bjud in vuxen</span>
          <span class="mt-0.5 block text-sm text-adult-text-secondary">Dela familjens ansvar</span>
        </span>
        <svg viewBox="0 0 24 24" class="size-4 shrink-0 text-adult-text-secondary" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 5l7 7-7 7" />
        </svg>
      </a>
      <a
        routerLink="/vuxen/historik"
        class="flex items-center gap-3 rounded-lg border border-adult-border bg-adult-surface p-3 no-underline transition hover:border-adult-accent/30"
      >
        <span
          class="grid size-10 shrink-0 place-items-center rounded-lg bg-adult-accent-soft text-adult-accent-dark"
          aria-hidden="true"
        >
          <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8.5" />
            <path d="M12 7.5V12l3 2" />
          </svg>
        </span>
        <span class="min-w-0 flex-1">
          <span class="block text-[15px] font-semibold text-adult-text">Historik</span>
          <span class="mt-0.5 block text-sm text-adult-text-secondary">Familjens avslutade aktiviteter</span>
        </span>
        <svg viewBox="0 0 24 24" class="size-4 shrink-0 text-adult-text-secondary" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 5l7 7-7 7" />
        </svg>
      </a>
    </nav>

    <div class="mt-6 border-t border-adult-border pt-4">
      <button
        type="button"
        (click)="logout()"
        class="flex w-full items-center gap-3 rounded-lg border border-adult-border bg-adult-surface p-3 text-left transition hover:border-adult-danger-border/60"
      >
        <span class="grid size-10 shrink-0 place-items-center rounded-lg bg-adult-bg text-adult-text-secondary" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4" />
            <path d="M16 8l4 4-4 4" />
            <path d="M20 12H9" />
          </svg>
        </span>
        <span class="text-[15px] font-semibold text-adult-text">Logga ut</span>
      </button>
    </div>
  </main>
</div>
