<div class="page-enter min-h-dvh bg-adult-bg pb-24 md:flex md:pb-0">
  <app-adult-bottom-nav />
  <main class="mx-auto w-full max-w-2xl flex-1 px-4 py-5 sm:px-6 md:px-8 md:py-8">
    <app-adult-page-header
      title="Bjud in vuxen"
      subtitle="Skapa en engångskod och dela den med den vuxna som ska gå med i familjen."
    />

    @if (errorMessage()) {
      <div
        class="mt-4 rounded-lg border border-adult-danger-border bg-adult-danger-bg px-4 py-3 text-sm font-medium text-adult-danger-text"
        role="alert"
      >
        {{ errorMessage() }}
      </div>
    }

    <div class="mt-6 rounded-lg border border-adult-border bg-adult-surface p-5">
      @if (invitation(); as result) {
        <div class="rounded-lg border border-adult-border bg-adult-accent-soft p-5 text-center" aria-live="polite">
          <p class="text-xs font-semibold tracking-wider text-adult-accent-dark uppercase">Engångskod</p>
          <p class="mt-2 text-3xl font-semibold tracking-[0.14em] text-adult-text">{{ result.code }}</p>
          <p class="mt-2 text-sm text-adult-text-secondary">Giltig till {{ result.expiresAt | date: 'short' }}</p>
          <button type="button" adultSecondaryTintButton class="mt-4" (click)="copyCode()">
            {{ copied() ? 'Kopierad' : 'Kopiera kod' }}
          </button>
        </div>
        <a
          routerLink="/acceptera-inbjudan"
          class="mt-4 block text-center text-sm font-semibold text-adult-accent underline"
        >
          Öppna registreringen
        </a>
      } @else {
        <button
          type="button"
          adultPrimaryButton
          class="w-full"
          [disabled]="isSubmitting()"
          (click)="createInvitation()"
        >
          {{ isSubmitting() ? 'Skapar kod…' : 'Skapa engångskod' }}
        </button>
      }
    </div>
  </main>
</div>
