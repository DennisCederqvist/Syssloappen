<div class="page-enter min-h-dvh bg-canvas pb-24 md:flex md:pb-0">
  <app-bottom-nav [items]="navItems" />
  <main class="mx-auto w-full max-w-4xl flex-1 px-4 py-5 sm:px-6 md:px-8 md:py-8">
    <app-user-header eyebrow="Familj" title="Bjud in en vuxen" variant="adult" />
    <section class="mt-7 max-w-xl rounded-3xl bg-white p-6 shadow-sm ring-1 ring-line sm:p-8">
      <p class="leading-7 text-muted">Skapa en engångskod och dela den med den vuxna som ska gå med i familjen.</p>
      @if (errorMessage()) { <p class="mt-4 rounded-2xl bg-red-50 p-4 text-sm font-bold text-red-800" role="alert">{{ errorMessage() }}</p> }
      @if (invitation(); as result) {
        <div class="mt-6 rounded-2xl bg-brand-50 p-5 text-center ring-1 ring-brand-500/20" aria-live="polite">
          <p class="text-xs font-extrabold uppercase text-brand-600">Engångskod</p>
          <p class="mt-2 text-3xl font-black tracking-[0.14em]">{{ result.code }}</p>
          <p class="mt-2 text-sm text-muted">Giltig till {{ result.expiresAt | date: 'short' }}</p>
          <button type="button" (click)="copyCode()" class="mt-5 min-h-12 rounded-xl bg-white px-5 font-extrabold text-brand-600 ring-1 ring-line">{{ copied() ? 'Kopierad' : 'Kopiera kod' }}</button>
          <a routerLink="/acceptera-inbjudan" class="mt-4 block font-extrabold text-brand-600 underline">Öppna registreringen</a>
        </div>
      } @else {
        <button type="button" (click)="createInvitation()" [disabled]="isSubmitting()" class="mt-6 min-h-14 w-full rounded-2xl bg-brand-500 px-5 font-extrabold text-white">{{ isSubmitting() ? 'Skapar kod…' : 'Skapa engångskod' }}</button>
      }
    </section>
  </main>
</div>
